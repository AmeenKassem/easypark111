spring.datasource.url=jdbc:h2:mem:easypark_acceptance_tests;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=false

# Use your real JWT config key name if your JwtService expects a different property.
jwt.secret=acceptance-test-secret-key-acceptance-test-secret-key
jwt.expiration=86400000